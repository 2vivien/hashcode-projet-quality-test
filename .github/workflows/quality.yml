name: Package Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate package metadata
        run: npm pkg get name version bin exports files engines license
      - name: Syntax check
        run: |
          node --check src/index.mjs
          node --check src/cli.mjs
          node --check src/engine/index.mjs
          node --check src/engine/model.mjs
          node --check src/engine/config.mjs
          node --check src/engine/discovery.mjs
          node --check src/engine/planner.mjs
          node --check src/engine/runner.mjs
          node --check src/engine/evaluate.mjs
          node --check src/engine/oracle.mjs
          node --check src/engine/proof-ledger.mjs
          node --check src/engine/proof-graph.mjs
          node --check src/engine/proof-engine.mjs
          node --check src/engine/harness.mjs
          node --check src/engine/dataset.mjs
          node --check src/engine/evidence.mjs
          node --check src/engine/requirements.mjs
          node --check src/engine/regression.mjs
          node --check src/engine/evaluators.mjs
          node --check src/engine/run-integrity.mjs
          node --check src/agent/route-discovery.mjs
          node --check src/agent/scenarios.mjs
          node --check src/agent/browser-agent.mjs
          node --check src/agent/api-agent.mjs
          node --check src/agent/github-reporter.mjs
          node --check src/agent/index.mjs
          node --check src/agent/config.mjs
      - name: Engine unit tests
        run: npm test
      - name: CLI smoke test
        run: |
          node src/cli.mjs --help
          node src/cli.mjs doctor --json
          node src/cli.mjs audit --json
          node src/cli.mjs check --profile minimal --json
          node src/cli.mjs prove --json
          node src/cli.mjs verify --json
          node src/cli.mjs agent --json
      - name: Package dry run
        run: npm pack --dry-run
      - name: Dependency audit
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
